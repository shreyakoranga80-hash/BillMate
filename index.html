<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tip Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <h1>Tip Calculator</h1>

        <p class="subtitle">
            Split your bill with friends
        </p>

        <!-- Bill Input -->

        <section class="input-section">

            <label for="bill">
                Bill Amount (₹)
            </label>

            <input
                type="number"
                id="bill"
                placeholder="Enter bill amount"
                min="0"
                step="0.01"
            >

        </section>

        <!-- Tip Buttons -->

        <section class="input-section">

            <h2>Select Tip</h2>

            <div class="tip-buttons">

                <button type="button" class="tip-btn" data-tip="5">
                    5%
                </button>

                <button type="button" class="tip-btn" data-tip="10">
                    10%
                </button>

                <button type="button" class="tip-btn" data-tip="15">
                    15%
                </button>

                <button type="button" class="tip-btn" data-tip="20">
                    20%
                </button>

            </div>

        </section>

        <!-- Number of People -->

        <section class="input-section">

            <label for="people">
                Number of People
            </label>

            <input
                type="number"
                id="people"
                placeholder="Enter number of people"
                min="1"
                step="1"
            >

        </section>

        <!-- Calculate Button -->

        <button id="calculate-btn" type="button">
            Calculate
        </button>

        <!-- Results -->

        <section class="results" aria-live="polite">

            <div class="result-row">

                <span>Tip Amount</span>

                <strong id="tip-amount">₹0.00</strong>

            </div>

            <div class="result-row">

                <span>Total Amount</span>

                <strong id="total-amount">₹0.00</strong>

            </div>

            <div class="result-row">

                <span>Per Person</span>

                <strong id="per-person">₹0.00</strong>

            </div>

            <p id="error-message" role="alert"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
